[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stratafetch"
path = "src/main.rs"

[[bin]]
name = "stratafetch-desktop"
path = "src/desktop.rs"

[dependencies]
strata-core = { path = "../strata-core" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
directories = "6"
open = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

