[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stratafetch"
path = "src/main.rs"

[[bin]]
name = "stratafetch-desktop"
path = "src/desktop.rs"

[[bin]]
name = "stratafetch-browser-host"
path = "src/browser_host.rs"

[dependencies]
strata-core = { path = "../strata-core" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
directories = "6"
open = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Foundation"] }

