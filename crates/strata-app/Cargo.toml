[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stratafetch"
path = "src/main.rs"

[[bin]]
name = "stratafetch-desktop"
path = "src/desktop.rs"

[[bin]]
name = "stratafetch-browser-host"
path = "src/browser_host.rs"

[dependencies]
strata-core = { path = "../strata-core" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland", "persistence"] }
directories = "6"
open = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["serde"] }
time = { version = "0.3.47", default-features = false, features = ["std"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "common-controls-v6"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi"] }
